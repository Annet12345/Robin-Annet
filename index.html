<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Robin & Annet — Wedding Invitation</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 50% 35%,#5a1510,#200403 55%,#070101);font-family:Georgia,serif;color:#f8e6b0;display:flex;align-items:center;justify-content:center;overflow:hidden}.wrap{width:100%;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}.screen{text-align:center}.envelope{width:min(86vw,720px);cursor:pointer;transition:opacity .6s,transform .7s;filter:drop-shadow(0 25px 35px #000b)}.envelope img{width:100%;display:block}.envelope.opened{opacity:0;transform:scale(.82) translateY(25px);pointer-events:none}.hint{margin-top:16px;font-size:13px;letter-spacing:.13em}.book{display:none;position:relative;width:min(84vw,650px);height:min(78vh,900px);perspective:1800px}.book.show{display:block}.page{position:absolute;inset:0;backface-visibility:hidden;background-size:100% 100%;background-position:center;background-repeat:no-repeat;border-radius:4px;box-shadow:0 25px 55px #000b;transition:transform .9s cubic-bezier(.2,.75,.2,1);transform-style:preserve-3d}.p1{background-image:url('assets/page1.png')}.p2{background-image:url('assets/page2.png');transform:rotateY(180deg)}.flip .p1{transform:rotateY(-180deg)}.flip .p2{transform:rotateY(0)}.controls{position:absolute;left:50%;bottom:-62px;transform:translateX(-50%);display:flex;gap:9px;align-items:center;white-space:nowrap}button{border:1px solid #d9ad5c;background:linear-gradient(#64170f,#2e0504);color:#ffeab0;border-radius:25px;padding:11px 17px;font:13px Georgia,serif;cursor:pointer}.num{font-size:12px;min-width:76px}.close{position:absolute;right:-10px;top:-45px;border-radius:50%;width:38px;height:38px;padding:0;font-size:19px;z-index:4}@media(max-width:600px){.wrap{padding:12px}.book{width:min(88vw,500px);height:min(75vh,720px)}.controls{bottom:-58px}.hint{font-size:11px}}
</style></head><body><main class="wrap"><div class="screen"><div class="envelope" id="env"><img src="assets/envelope.png" alt="Burgundy wedding envelope"><div class="hint">CLICK THE ENVELOPE TO OPEN</div></div><div class="book" id="book"><button class="close" id="close">×</button><div class="page p1"></div><div class="page p2"></div><div class="controls"><button id="prev" disabled>‹ Previous</button><span class="num" id="num">PAGE 1 OF 2</span><button id="next">Flip to Page 2 ›</button></div></div></div></main><script>const e=document.getElementById('env'),b=document.getElementById('book'),n=document.getElementById('next'),p=document.getElementById('prev'),c=document.getElementById('close'),num=document.getElementById('num');let page=1;function setPage(x){page=x;b.classList.toggle('flip',x===2);p.disabled=x===1;n.disabled=x===2;n.textContent=x===1?'Flip to Page 2 ›':'Page 2';num.textContent=`PAGE ${x} OF 2`}e.onclick=()=>{e.classList.add('opened');setTimeout(()=>b.classList.add('show'),500)};n.onclick=()=>setPage(2);p.onclick=()=>setPage(1);c.onclick=()=>{b.classList.remove('show');setTimeout(()=>e.classList.remove('opened'),350);setPage(1)};let sx=null;b.addEventListener('touchstart',x=>sx=x.touches[0].clientX,{passive:true});b.addEventListener('touchend',x=>{if(sx==null)return;let dx=x.changedTouches[0].clientX-sx;if(Math.abs(dx)>50)setPage(dx<0?2:1);sx=null},{passive:true});</script></body></html>
